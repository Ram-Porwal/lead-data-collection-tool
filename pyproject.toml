[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-data-collection-tool"
version = "0.1.0"
description = "Automated lead discovery, validation, enrichment, and export pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "email-validator",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]